<!--
  ============================================================================
  Burn The Sky — cabecera

  Que poner en overall_header, justo despues de {CSS} y antes de </head>.

  Hay que pegarlo entero. Foroactivo no deja anadir <link> sueltos al panel,
  asi que la cabecera es el unico sitio donde pueden vivir las hojas externas,
  que es exactamente lo que hace Blinding Lights.

  ============================================================================
  LO MAS IMPORTANTE DE ESTE FICHERO: EL ?v= DE CADA HOJA
  ============================================================================

  GitHub Pages sirve los ficheros con una cache de unos diez minutos. Sin un
  `?v=` en la URL, el navegador guarda `04-thread.css` en su cache y, cuando se
  sube una version nueva, sigue dando la vieja durante esos diez minutos.

  Por eso ha pasado varias veces: se suben las hojas, se recarga, y no se ve
  nada. La conclusion era que el CSS estaba mal. No lo estaba. La ultima vez se
  comprobo que `.post` mide 860 px con la hoja nueva en el servidor, mientras
  que en las capturas el post ocupaba el ancho entero de antes: se estaba viendo
  la version vieja, servida desde la cache del navegador.

  El `?v=` no es un truco. Es una URL distinta, asi que el navegador no tiene
  nada cacheado y la pide de cero.

  CUANDO CAMBIEN LAS HOJAS, SUBE EL NUMERO DE ESTE BLOQUE. Solo el numero.
  Ahora es 7.

  ============================================================================
  EL ORDEN DE LAS HOJAS
  ============================================================================

  Van detras de {CSS}, que es la base de phpBB, y en este orden. Cambiar el
  orden cambia quien gana, porque muchas reglas se empatan a igualdad de
  especificidad y entonces decide la que va despues.

  LAS DOS ULTIMAS VAN EN ESTE ORDEN A PROPOSITO. 11-topbar va antes que
  07-responsive porque 07 lleva dentro todos los @media de la skin, y si se
  cargara despues sus reglas se amontonarian encima de las de 11 sin mirar el
  ancho. Hoy no se pelean —la barra no se pliega—, pero si manana la barra
  vuelve a verse en movil, el media query tiene que ganar.

  11-topbar es la unica hoja que se puede quitar sin tocar nada mas. Si hay que
  devolver la barra de Foroactivo por lo que sea, se borra su <link> de aqui y
  ya esta: no hay ningun otro sitio donde dependa de ella.

  Para desplegar: sube la carpeta bts/ a GitHub Pages.
  ============================================================================
-->
