<!-- ==========================================================================
     LA TABLA DE NOTICIAS (reinicio)

     En index_body, donde estaba el bloque de estadísticas. Publicar A MANO:
     index_body no se publica por script.

     "Últimos temas" va con IF por si el panel no trae la lista: sin él saldría
     el nombre de la variable escrito en la página. Sin ventana de personal:
     phpBB no expone administradores en el índice; el personal vive en el
     bloque DATABASE (plantillas/bloque-database.html).
     ========================================================================== -->
<div class="panel bts-noticia">
  <div class="inner">

    <div class="bts-noticia-fila">

      <!-- IF S_RECENT_TOPIC_LIST -->
      <div class="bts-noticia-col">
        <h3 class="bts-noticia-titulo">{L_RECENT_TOPICS}</h3>
        <ul class="bts-noticia-temas">
          <!-- BEGIN recent_topics -->
          <li>
            <a href="{topic_row_url}">{topic_row_title}</a>
            <span class="gensmall">{topic_row_posts} &middot; {topic_row_time}</span>
          </li>
          <!-- END recent_topics -->
        </ul>
      </div>
      <!-- ENDIF -->

      <div class="bts-noticia-col">
        <h3 class="bts-noticia-titulo">{L_STATISTICS}</h3>
        <div class="bts-cifras">
          <p>{TOTAL_POSTS}</p>
          <p>{TOTAL_USERS}</p>
          <p>{NEWEST_USER}</p>
        </div>
      </div>

      <div class="bts-noticia-col bts-noticia-online">
        <h3 class="bts-noticia-titulo"><a href="{U_VIEWONLINE}" rel="nofollow">{L_WHO_IS_ONLINE}</a></h3>
        <p>{TOTAL_USERS_ONLINE}</p>
        <p>{RECORD_USERS}</p>
        <p>{LOGGED_IN_USER_LIST}</p>
      </div>

    </div>

    <!-- BEGIN switch_group_legend -->
    <div class="bts-noticia-leyenda">
      <span class="bts-noticia-leyenda-titulo">{LEGEND}</span>
      {GROUP_LEGEND}
    </div>
    <!-- END switch_group_legend -->

  </div>
</div>
